name: Re:Build
description: >-
  Re:Build Manufacturing is a U.S.-based industrial engineering and manufacturing
  company that takes complex products from concept to full-rate production through
  integrated design, engineering, and scalable domestic manufacturing. Founded to
  rebuild American manufacturing capacity, the company operates a family of
  specialized engineering and production businesses across more than 14 U.S.
  locations, spanning aerospace and defense, electrification, energy and
  environment, medical devices, and robotics and automation. With 400+ engineers
  and roughly one million square feet of industrial footprint, Re:Build partners
  with startups and established manufacturers to develop, industrialize, and
  produce advanced physical products. It was surfaced as a portfolio company of
  General Catalyst and added to the API Evangelist network; enrichment confirms it
  is an industrial/manufacturing company with no public API, developer, or machine
  surface at this time.
